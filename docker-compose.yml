services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacancies}
      POSTGRES_USER: ${POSTGRES_USER:-vacancies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only, so you can connect with a desktop SQL client.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vacancies}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vacancies}
      RUN_INTERVAL_MINUTES: ${RUN_INTERVAL_MINUTES:-360}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  pgdata:
